name: AI Agent - Create Feature Branch
run-name: Create branch for ${{ inputs.work_item }}

on:
  workflow_dispatch:
    inputs:
      work_item:
        description: "Example: WPL-101 Add ASN validation"
        required: true
        type: string
      base_branch:
        description: "Base branch"
        required: true
        default: main
        type: string
      branch_type:
        description: "Branch type"
        required: true
        default: feature
        type: choice
        options: [feature, bugfix, hotfix]

permissions:
  contents: write

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - name: Create remote branch through GitHub API
        id: branch
        uses: actions/github-script@v7
        env:
          WORK_ITEM: ${{ inputs.work_item }}
          BASE_BRANCH: ${{ inputs.base_branch }}
          BRANCH_TYPE: ${{ inputs.branch_type }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const workItem = process.env.WORK_ITEM.trim();
            const base = process.env.BASE_BRANCH.trim();
            const type = process.env.BRANCH_TYPE.trim();
            const ticketMatch = workItem.match(/\b([A-Za-z][A-Za-z0-9]*-\d+)\b/);
            const ticket = ticketMatch ? ticketMatch[1].toLowerCase() : "";
            const text = workItem
              .replace(/\b[A-Za-z][A-Za-z0-9]*-\d+\b/, "")
              .toLowerCase().replace(/[^a-z0-9]+/g, "-")
              .replace(/^-+|-+$/g, "").replace(/-+/g, "-")
              .slice(0, 60).replace(/-+$/g, "");
            const suffix = [ticket, text].filter(Boolean).join("-");
            if (!suffix) return core.setFailed("Cannot generate a branch name.");
            const branch = `${type}/${suffix}`;
            const { owner, repo } = context.repo;

            let baseRef;
            try {
              baseRef = await github.rest.git.getRef({owner, repo, ref: `heads/${base}`});
            } catch (e) {
              return core.setFailed(`Base branch '${base}' was not found.`);
            }

            try {
              await github.rest.git.getRef({owner, repo, ref: `heads/${branch}`});
              return core.setFailed(`Branch '${branch}' already exists.`);
            } catch (e) {
              if (e.status !== 404) throw e;
            }

            await github.rest.git.createRef({
              owner, repo,
              ref: `refs/heads/${branch}`,
              sha: baseRef.data.object.sha
            });
            const url = `https://github.com/${owner}/${repo}/tree/${branch}`;
            core.setOutput("name", branch);
            core.setOutput("url", url);
            await core.summary.addHeading("Branch created successfully")
              .addRaw(`Branch: \`${branch}\`\n\nBase: \`${base}\`\n\n`)
              .addLink("Open branch", url).write();
